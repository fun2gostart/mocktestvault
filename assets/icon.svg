<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Outer Protective Shield -->
  <path d="M 256 76 L 380 128 C 380 272 256 396 256 424 C 256 396 132 272 132 128 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Inner Vault Shield Inset -->
  <path d="M 256 108 L 356 150 C 356 264 256 364 256 388 C 256 364 156 264 156 150 Z" 
        fill="#0f172a" opacity="0.55"/>

  <!-- Academic Checkmark & Verification Crest -->
  <path d="M 216 262 L 244 290 L 308 214" 
        fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Exam Metric Dots -->
  <circle cx="256" cy="344" r="10" fill="#60a5fa"/>
</svg>